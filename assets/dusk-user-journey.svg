<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="750" viewBox="0 0 1800 750"><rect width="1800" height="750" rx="18" fill="#faf9fc"/><style>text{font-family:Arial,sans-serif;fill:#626a75;font-size:19px}.head{font-size:22px;font-weight:600;fill:#373345}.label{font-size:18px;font-weight:600}</style><text x="28" y="52" class="head">My reporting workflow before Dusk</text><text x="28" y="82" font-size="16">My own routine, repeated for daily, weekly and monthly reports.</text><rect x="20" y="110" width="130" height="92" rx="7" fill="#f0eff4"/><text x="34" y="145" class="label">Stage</text><rect x="160" y="110" width="248" height="92" rx="7" fill="#eee9f8" stroke="#e5e3ec"/><text x="176" y="145" class="head">01  Gather</text><rect x="420" y="110" width="248" height="92" rx="7" fill="#eee9f8" stroke="#e5e3ec"/><text x="436" y="145" class="head">02  Log</text><rect x="680" y="110" width="248" height="92" rx="7" fill="#eee9f8" stroke="#e5e3ec"/><text x="696" y="145" class="head">03  Filter</text><rect x="940" y="110" width="248" height="92" rx="7" fill="#eee9f8" stroke="#e5e3ec"/><text x="956" y="145" class="head">04  Copy to AI</text><rect x="1200" y="110" width="248" height="92" rx="7" fill="#eee9f8" stroke="#e5e3ec"/><text x="1216" y="145" class="head">05  Generate</text><rect x="1460" y="110" width="248" height="92" rx="7" fill="#eee9f8" stroke="#e5e3ec"/><text x="1476" y="145" class="head">06  Submit</text><rect x="20" y="214" width="130" height="154" rx="7" fill="#f0eff4"/><text x="34" y="249" class="label">What I do</text><rect x="160" y="214" width="248" height="154" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="176" y="249">Check what I worked on</text><text x="176" y="276">across messages,</text><text x="176" y="303">tickets and documents.</text><rect x="420" y="214" width="248" height="154" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="436" y="249">Add tasks, projects and</text><text x="436" y="276">work types to my daily</text><text x="436" y="303">log.</text><rect x="680" y="214" width="248" height="154" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="696" y="249">Choose the project or</text><text x="696" y="276">work type and the dates</text><text x="696" y="303">I need.</text><rect x="940" y="214" width="248" height="154" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="956" y="249">Copy the selected</text><text x="956" y="276">entries into an AI chat</text><text x="956" y="303">and ask for a report.</text><rect x="1200" y="214" width="248" height="154" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="1216" y="249">Check the generated</text><text x="1216" y="276">report and adjust it if</text><text x="1216" y="303">needed.</text><rect x="1460" y="214" width="248" height="154" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="1476" y="249">Copy the generated</text><text x="1476" y="276">report into the</text><text x="1476" y="303">reporting form.</text><rect x="20" y="380" width="130" height="114" rx="7" fill="#f0eff4"/><text x="34" y="415" class="label">Tools</text><rect x="160" y="380" width="248" height="114" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="176" y="415">Outlook · Slack · Jira</text><text x="176" y="442">· Confluence</text><rect x="420" y="380" width="248" height="114" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="436" y="415">Notion</text><rect x="680" y="380" width="248" height="114" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="696" y="415">Notion filters</text><rect x="940" y="380" width="248" height="114" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="956" y="415">Notion → AI tool</text><rect x="1200" y="380" width="248" height="114" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="1216" y="415">AI tool</text><rect x="1460" y="380" width="248" height="114" rx="7" fill="#ffffff" stroke="#e5e3ec"/><text x="1476" y="415">AI tool → Reporting</text><text x="1476" y="442">form</text><rect x="20" y="506" width="130" height="154" rx="7" fill="#f0eff4"/><text x="34" y="541" class="label">Friction</text><rect x="160" y="506" width="248" height="154" rx="7" fill="#fff8f2" stroke="#e5e3ec"/><text x="176" y="541">Work information is</text><text x="176" y="568">spread across tools.</text><rect x="420" y="506" width="248" height="154" rx="7" fill="#fff8f2" stroke="#e5e3ec"/><text x="436" y="541">I still update the</text><text x="436" y="568">records manually.</text><rect x="680" y="506" width="248" height="154" rx="7" fill="#fff8f2" stroke="#e5e3ec"/><text x="696" y="541">Each report needs a</text><text x="696" y="568">different selection.</text><rect x="940" y="506" width="248" height="154" rx="7" fill="#fff8f2" stroke="#e5e3ec"/><text x="956" y="541">I move the records into</text><text x="956" y="568">another tool.</text><rect x="1200" y="506" width="248" height="154" rx="7" fill="#fff8f2" stroke="#e5e3ec"/><text x="1216" y="541">The report sits</text><text x="1216" y="568">separately from the</text><text x="1216" y="595">records.</text><rect x="1460" y="506" width="248" height="154" rx="7" fill="#fff8f2" stroke="#e5e3ec"/><text x="1476" y="541">Another copy-and-paste</text><text x="1476" y="568">step, repeated for the</text><text x="1476" y="595">next report.</text><text x="28" y="710" font-size="18">Opportunity: bring work records and AI report generation into one place.</text></svg>