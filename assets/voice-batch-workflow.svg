<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440"><title>New batch voice production workflow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#405B5B" stroke-width="1.4" /></marker></defs><rect width="1440" height="440" rx="16" fill="#F0F6F4" /><g font-family="Inter,-apple-system,'Helvetica Neue',Arial,sans-serif"><text x="60" y="45" text-anchor="start" font-size="13" font-weight="600" fill="#6C8582">SETUP</text><text x="450" y="45" text-anchor="start" font-size="13" font-weight="600" fill="#43766E">BATCH RUN</text><line x1="390" y1="30" x2="390" y2="410" stroke="#8BAAA3" stroke-dasharray="4 5" stroke-width="1.3" /><rect x="60" y="75" width="285" height="50" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="202.5" y="106.0" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Train character model</text><text x="202" y="145" text-anchor="middle" font-size="12" font-weight="400" fill="#6C8582">Once per character</text><rect x="60" y="170" width="285" height="50" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="202.5" y="201.0" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Copy script &amp; template</text><rect x="60" y="250" width="285" height="62" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="202.5" y="275.5" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Replace model paths,</text><text x="202.5" y="298.5" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">reference audio &amp; text</text><rect x="60" y="342" width="285" height="56" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="202.5" y="364.5" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Start local GPT-SoVITS</text><text x="202.5" y="387.5" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">service</text><path d="M202 150V164" fill="none" stroke="#405B5B" stroke-width="1.3" marker-end="url(#arrow)" /><path d="M202 220V244" fill="none" stroke="#405B5B" stroke-width="1.3" marker-end="url(#arrow)" /><path d="M202 312V336" fill="none" stroke="#405B5B" stroke-width="1.3" marker-end="url(#arrow)" /><rect x="450" y="338" width="280" height="64" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="590.0" y="364.5" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Copy all names &amp; dialogue</text><text x="590.0" y="387.5" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">at once</text><rect x="825" y="338" width="200" height="64" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="925.0" y="376.0" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Run script</text><rect x="1120" y="338" width="260" height="64" fill="#fff" stroke="#405B5B" stroke-width="1.3" /><text x="1250" y="364" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">Auto-name audio &amp;</text><text x="1250" y="387" text-anchor="middle" font-size="17" font-weight="400" fill="#263B3B">save by category</text><path d="M345 370H444" fill="none" stroke="#405B5B" stroke-width="1.3" marker-end="url(#arrow)" /><path d="M730 370H819" fill="none" stroke="#405B5B" stroke-width="1.3" marker-end="url(#arrow)" /><path d="M1025 370H1114" fill="none" stroke="#405B5B" stroke-width="1.3" marker-end="url(#arrow)" /></g></svg>