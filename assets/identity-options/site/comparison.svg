<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1210" viewBox="0 0 1280 1210"><rect width="1280" height="1210" fill="#F4F5F7"/><text x="56" y="59" font-family="Arial,sans-serif" font-size="25" fill="#626A75">Identity / in the context of your homepage</text><text x="56" y="89" font-family="Arial,sans-serif" font-size="14" fill="#7E8792">Raspberry hold + the site’s existing slate blue. No changes applied to the live pages.</text><g transform="translate(56 128)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="13" fill="#7E8792">01 / Quiet serif</text><rect y="20" width="1168" height="472" rx="10" fill="white"/><g transform="translate(42 42) scale(.76)"><path d="M9 31C7 24 8 12 11 8C14 4 20 7 26 11C34 16 42 24 41 29C40 35 23 40 15 39C11 39 10 36 9 31Z" fill="#B63E69"/><circle cx="23" cy="24" r="2.6" fill="#842B4D"/><text x="55" y="33" font-family="Georgia,serif" font-size="30" font-weight="400" letter-spacing="-1" font-style="italic" fill="#60758C">Zoey Xiong</text></g><text x="865" y="66" font-family="Arial,sans-serif" font-size="13" fill="#626A75">Work　　About　　Personal　　CV ↗</text><path d="M0 91H1168" stroke="#E3E6EA"/><text x="42" y="139" font-family="Arial,sans-serif" font-size="12" fill="#60758C">⌖ Based in London, UK</text><text x="42" y="201" font-family="Arial,sans-serif" font-size="38" font-weight="500" letter-spacing="-1" fill="#292D33">Product designer,</text><text x="42" y="248" font-family="Arial,sans-serif" font-size="38" font-weight="500" letter-spacing="-1" fill="#292D33">with a background in AI and development.</text><text x="42" y="304" font-family="Arial,sans-serif" font-size="15" fill="#626A75">I work across UX/UI design, frontend development and AI.</text><text x="42" y="330" font-family="Arial,sans-serif" font-size="15" fill="#626A75">Understanding both design and code helps me make decisions that</text><text x="42" y="356" font-family="Arial,sans-serif" font-size="15" fill="#626A75">work for users and can be carried throug